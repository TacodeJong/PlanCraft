[package]
name = "plancraft-app"
description = "PlanCraft desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "plancraft"
path = "src/main.rs"

[dependencies]
plancraft-core.workspace = true
plancraft-mcp.workspace = true
plancraft-server.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
egui = "0.36"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
# SVG rasterizing for the embedded Lucide icons (assets/icons), nothing else.
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
# Blocking HTTP for Distill. Rustls, so the app does not need OpenSSL.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# Platform key store: macOS Keychain, Windows Credential Manager, Linux Secret Service.
keyring = "3"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }
# Validates the embedded icon SVGs in unit tests (the app itself rasterizes via egui_extras).
resvg = { version = "0.45", default-features = false }

# Files opened from Finder arrive as an "open documents" event (`src/mac_open.rs`). Pure Rust
# bindings to Apple's frameworks, the same versions eframe already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-services", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[lints]
workspace = true
