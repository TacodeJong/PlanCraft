[workspace]
resolver = "3"
members = [
    "crates/plancraft-core",
    "crates/plancraft-engine",
    "crates/plancraft-mcp",
    "crates/plancraft-server",
    "crates/plancraft-ui-egui",
    "apps/plancraft",
    "apps/plancraft-cli",
    "xtask",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "CC0-1.0"
authors = ["TacodeJong", "rallegretti <rob.allegretti@gmail.com>"]
repository = "https://github.com/TacodeJong/PlanCraft"
# craft-libs / PhotoCraft pin.
rust-version = "1.95"

[workspace.dependencies]
plancraft-core = { path = "crates/plancraft-core" }
plancraft-engine = { path = "crates/plancraft-engine" }
plancraft-mcp = { path = "crates/plancraft-mcp" }
plancraft-server = { path = "crates/plancraft-server" }
plancraft-ui-egui = { path = "crates/plancraft-ui-egui" }
# storytold/craft-libs @ PhotoCraft pin (window frame + TitleBar / AppShell).
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "77c7c62345c1f4213f59a07d9fdc156ecde0b540", default-features = false, features = ["ui"] }
craft-ui-shell = { git = "https://github.com/storytold/craft-libs", rev = "77c7c62345c1f4213f59a07d9fdc156ecde0b540" }
craft-theme = { git = "https://github.com/storytold/craft-libs", rev = "77c7c62345c1f4213f59a07d9fdc156ecde0b540" }
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: a value read back must be the value written, or a shared plan never settles
# (the default parser is off by one in the last place for some values, such as 300/1440).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# Dates and times (replacing chrono, which is unmaintained: RUSTSEC-2026-0543).
jiff = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"

# Suite egui/winit forks (same family as PhotoCraft; enables craft-ui / craft-window).
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "8a3c5ecb29ab8679d57035f2cb51d7ec8a5c080f" }
emath = { git = "https://github.com/storytold/egui.git", rev = "8a3c5ecb29ab8679d57035f2cb51d7ec8a5c080f" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "8a3c5ecb29ab8679d57035f2cb51d7ec8a5c080f" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "8a3c5ecb29ab8679d57035f2cb51d7ec8a5c080f" }
egui = { git = "https://github.com/storytold/egui.git", rev = "8a3c5ecb29ab8679d57035f2cb51d7ec8a5c080f" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "8a3c5ecb29ab8679d57035f2cb51d7ec8a5c080f" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "8a3c5ecb29ab8679d57035f2cb51d7ec8a5c080f" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "8a3c5ecb29ab8679d57035f2cb51d7ec8a5c080f" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "8a3c5ecb29ab8679d57035f2cb51d7ec8a5c080f" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "8a3c5ecb29ab8679d57035f2cb51d7ec8a5c080f" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"

[workspace.lints.rust]
# Only the desktop UI crate calls into the OS with `unsafe`: the Windows console attach
# (allowed at that one call) and the macOS open-documents handler (`mac_open.rs`).
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
# PlanCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# CLAUDE.md › Never crash). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
